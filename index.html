<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque">
<link rel="manifest" href="manifest.webmanifest">
<title>Estoque • 23 módulos</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#111827;--soft:#e5e7eb;--green:#15803d;--yellow:#a16207;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}
.wrap{max-width:1000px;margin:auto;padding:14px 14px 40px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
input,select,button{font:inherit}input,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;font-size:16px}
button{min-height:46px;border:0;border-radius:12px;padding:10px 14px;font-weight:650;cursor:pointer}
.primary{background:var(--accent);color:white}.secondary{background:var(--soft);color:var(--text)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:12px}
.module{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.module h2{font-size:16px;margin:0 0 9px}.positions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.pos{background:#f9fafb;border:1px solid var(--line);text-align:left;padding:9px;border-radius:10px;min-width:0}
.pos strong{display:block;font-size:13px}.pos .items{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35;overflow-wrap:anywhere}
.pos.found{outline:3px solid #111827;background:#eef2ff}
.empty{color:#9ca3af}.low{color:var(--yellow)}.out{color:var(--red)}
dialog{width:min(520px,calc(100% - 24px));border:0;border-radius:18px;padding:0;box-shadow:0 20px 70px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.45)}.modal{padding:18px}.modal h2{margin:0 0 14px;font-size:19px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.hint{font-size:12px;color:var(--muted);margin:7px 0 0}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item button{min-height:38px;padding:6px 10px}.item b{font-size:14px}.item small{display:block;color:var(--muted);margin-top:2px}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>📦 Estoque</h1><div class="sub">23 módulos • 3 posições por módulo</div></header>
<main class="wrap">
  <div class="toolbar">
    <input id="search" type="search" placeholder="🔎 Pesquisar produto..." autocomplete="off">
    <button class="primary" id="addBtn">＋ Adicionar</button>
  </div>
  <div class="stats" id="stats"></div>
  <section class="grid" id="map"></section>
</main>

<dialog id="dlg">
  <form class="modal" id="form">
    <h2 id="modalTitle">Adicionar produto</h2>
    <input type="hidden" id="editId">
    <label>Produto<input id="name" required placeholder="Ex.: Massa Acrílica Suvinil"></label>
    <div class="row">
      <label>Quantidade<input id="qty" required type="number" min="0" step="1" value="0"></label>
      <label>Posição<select id="position"></select></label>
    </div>
    <label>Observação (opcional)<input id="note" placeholder="Ex.: caixa fechada"></label>
    <p class="hint">A quantidade pode ser atualizada depois. Use a posição para localizar rapidamente o item.</p>
    <div class="actions">
      <button type="button" class="secondary" id="cancel">Cancelar</button>
      <button type="submit" class="primary">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="viewDlg">
  <div class="modal">
    <h2 id="viewTitle"></h2>
    <div id="viewItems"></div>
    <div class="actions"><button class="secondary" id="viewClose">Fechar</button></div>
  </div>
</dialog>

<script>
const KEY="estoque_raceworks_v1";
let products=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
const positions=[];
for(let m=1;m<=23;m++){
  const mm=String(m).padStart(2,"0");
  [["C","Cima"],["M","Meio"],["B","Baixo"]].forEach(([code,label])=>positions.push({id:`M${mm}-${code}`,label,mod:m}));
}
positions.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=`Módulo ${String(p.mod).padStart(2,"0")} — ${p.label}`;$("position").appendChild(o)});

function save(){localStorage.setItem(KEY,JSON.stringify(products))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function stockClass(q){return q===0?"out":q<=3?"low":""}
function render(){
  const q=$("search").value.trim().toLowerCase();
  $("map").innerHTML="";
  let total=products.reduce((a,p)=>a+Number(p.qty||0),0), found=0;
  for(let m=1;m<=23;m++){
    const mm=String(m).padStart(2,"0");
    const box=document.createElement("article");box.className="module";
    box.innerHTML=`<h2>Prateleira / Módulo ${mm}</h2><div class="positions"></div>`;
    const grid=box.querySelector(".positions");
    [["C","Cima"],["M","Meio"],["B","Baixo"]].forEach(([code,label])=>{
      const pos=`M${mm}-${code}`;
      const items=products.filter(p=>p.position===pos);
      const matching=q?items.filter(p=>(p.name+" "+(p.note||"")).toLowerCase().includes(q)):items;
      if(q) found+=matching.length;
      const b=document.createElement("button");b.type="button";b.className="pos"+(q&&matching.length?" found":"");
      const body=matching.length?matching.map(p=>`<div class="items"><b>${esc(p.name)}</b> — <span class="${stockClass(Number(p.qty))}">${p.qty} un.</span></div>`).join(""):(q?"<div class='items empty'>Nenhum resultado</div>":"<div class='items empty'>Vazio</div>");
      b.innerHTML=`<strong>${label}</strong>${body}`;
      b.addEventListener("click",()=>openPosition(pos,label,matching.length?matching:items));
      grid.appendChild(b);
    });
    $("map").appendChild(box);
  }
  const itemCount=products.length;
  $("stats").innerHTML=`<span class="pill">📍 ${positions.length} posições</span><span class="pill">📦 ${itemCount} produtos</span><span class="pill">🔢 ${total} unidades</span>${q?`<span class="pill">🔎 ${found} resultado(s)</span>`:""}`;
}
function openPosition(pos,label,items){
  $("viewTitle").textContent=`${pos} — ${label}`;
  $("viewItems").innerHTML=items.length?items.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><small>${p.qty} unidade(s)${p.note?" • "+esc(p.note):""}</small></div><div><button class="secondary edit" data-id="${p.id}">Editar</button></div></div>`).join(""):"<p class='hint'>Nenhum produto cadastrado nesta posição.</p>";
  $("viewDlg").showModal();
  $("viewItems").querySelectorAll(".edit").forEach(btn=>btn.addEventListener("click",()=>{ $("viewDlg").close(); openEdit(btn.dataset.id);}));
}
function openEdit(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  $("modalTitle").textContent="Editar produto";$("editId").value=id;$("name").value=p.name;$("qty").value=p.qty;$("position").value=p.position;$("note").value=p.note||"";$("dlg").showModal();
}
$("addBtn").addEventListener("click",()=>{ $("form").reset();$("editId").value="";$("qty").value=0;$("modalTitle").textContent="Adicionar produto";$("dlg").showModal();$("name").focus();});
$("cancel").addEventListener("click",()=>$("dlg").close());
$("viewClose").addEventListener("click",()=>$("viewDlg").close());
$("search").addEventListener("input",render);
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const id=$("editId").value||crypto.randomUUID();
  const item={id,name:$("name").value.trim(),qty:Math.max(0,Number($("qty").value)),position:$("position").value,note:$("note").value.trim()};
  if(!item.name)return;
  const idx=products.findIndex(p=>p.id===id);
  if(idx>=0)products[idx]=item;else products.push(item);
  save();$("dlg").close();render();
});
render();
</script>
</body>
</html>
